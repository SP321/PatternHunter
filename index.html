 <!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pattern Hunter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Pattern Hunter</h1>
  </header>

  <main>
    <section class="left">
      <div class="panel">
        <div class="modeRow">
          <button id="modeSingle" class="btn modeBtn" data-mode="single" title="Find the shown pattern on the grid">Single</button>
          <button id="modeFour" class="btn modeBtn" data-mode="oneOfFour" title="Pick the right option or find it on the grid">One Of Four</button>
        </div>
        <div class="status" id="status"></div>
        <div id="options" class="options">
          <canvas class="optCanvas" data-idx="0" tabindex="0" aria-label="Option 1"></canvas>
          <canvas class="optCanvas" data-idx="1" tabindex="0" aria-label="Option 2"></canvas>
          <canvas class="optCanvas" data-idx="2" tabindex="0" aria-label="Option 3"></canvas>
          <canvas class="optCanvas" data-idx="3" tabindex="0" aria-label="Option 4"></canvas>
        </div>
      </div>

      <div class="panel stats">
        <div class="row"><span>Streak</span><span class="badge"><span id="streak">0</span></span></div>
        <div class="row"><span>Total Streak Time</span><span class="badge" id="streakTime">00:00</span></div>
        <div class="row"><span>Current Round Time</span><span class="badge" id="qTime">00:00</span></div>

        <div class="row btns">
          <div class="rc">
            <label>Grid size <input id="sizeInput" type="number" min="8" max="20" step="1" value="8"></label>
          </div>
        </div>
        <div class="row">
          <label class="modeToggle">
            <input id="bwToggle" type="checkbox" value=0> Black & White mode
          </label>
        </div>
        <div class="row">
          <div class="btnset">
            <button id="newGame" class="btn">New Round</button>
            <button id="reveal" class="btn" title="Show answer and reset">Reveal Answer</button>
          </div>
        </div>
      </div>
    </section>

    <section class="boardWrap" id="boardWrap">
      <canvas id="boardCanvas" aria-label="grid"></canvas>
    </section>
  </main>

  <footer>
    <div class="author">
      <a href="https://github.com/SP321/PatternHunter" target="_blank" rel="noopener noreferrer">
        SP321
      </a>
    </div>
  </footer>

  <script src="js/game.js"></script>
</body>
</html>
